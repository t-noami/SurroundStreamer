appId: com.surroundstreamer.beta
productName: SurroundStreamer-beta-0.1.1
buildVersion: 0.1.1
copyright: Copyright © 2026 Non-REM Studio
extraMetadata:
  version: 0.1.1-beta.10
directories:
  buildResources: build
  output: dist/beta
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!dist/**'
  - '!.tmp/**'
  - '!legacy/**'
  - '!SurroundWebPlayer/**'
  - '!resources/ffmpeg/**'
  - '!node_modules/.cache/**'
  - '!node_modules/ffmpeg-static/**'
  - '!docs/manual-assets/capture.html'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,test_streamconfig.txt}'
asarUnpack:
  - resources/**
  - native/audio-backends/windows/.build/**
mac:
  category: public.app-category.music
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: native/audio-backends/macos/.build/SurroundAudioBackend
      to: audio-backend
    - from: resources/ffmpeg/darwin-arm64/ffmpeg
      to: ffmpeg/darwin-arm64/ffmpeg
    - from: resources/ffmpeg/THIRD_PARTY_NOTICES.md
      to: ffmpeg/THIRD_PARTY_NOTICES.md
    - from: resources/ffmpeg/licenses
      to: ffmpeg/licenses
  extendInfo:
    NSMicrophoneUsageDescription: SurroundStreamer beta needs microphone access for audio device input.
    NSDocumentsFolderUsageDescription: SurroundStreamer beta needs access to selected audio files.
    NSDownloadsFolderUsageDescription: SurroundStreamer beta needs access to selected audio files.
  notarize: false
win:
  executableName: SurroundStreamer-beta-0.1.1
  signAndEditExecutable: false
  extraResources:
    - from: resources/ffmpeg/win32-x64/ffmpeg.exe
      to: ffmpeg/win32-x64/ffmpeg.exe
    - from: resources/ffmpeg/THIRD_PARTY_NOTICES.md
      to: ffmpeg/THIRD_PARTY_NOTICES.md
    - from: resources/ffmpeg/licenses
      to: ffmpeg/licenses
nsis:
  artifactName: SurroundStreamer-beta-0.1.1-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Non-REM Studio <info@non-rem.com>
  category: Utility
  extraResources:
    - from: resources/ffmpeg/linux-x64/ffmpeg
      to: ffmpeg/linux-x64/ffmpeg
    - from: resources/ffmpeg/THIRD_PARTY_NOTICES.md
      to: ffmpeg/THIRD_PARTY_NOTICES.md
    - from: resources/ffmpeg/licenses
      to: ffmpeg/licenses
appImage:
  artifactName: SurroundStreamer-beta-0.1.1.${ext}
npmRebuild: false
