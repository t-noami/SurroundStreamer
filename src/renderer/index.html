<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SurroundStreamer — 5.1 Surround Streamer</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link href="./assets/main.css" type="text/css" rel="stylesheet" />
  </head>

  <body class="dark-theme">
    <div id="app">
      <header>
        <div class="header-content">
          <div class="brand-mark">
            <img
              src="./brand/SurroundStreamer_logo_header.png"
              alt="SurroundStreamer"
              class="brand-logo"
            />
            <h1>SurroundStreamer</h1>
          </div>
          <div id="status-badge" class="badge idle">IDLE</div>
        </div>
      </header>

      <main>
        <section class="panel input-panel">
          <h2>Input Source</h2>
          <div class="tabs">
            <button id="tab-device" class="tab-btn active">Audio Input</button>
            <button id="tab-file" class="tab-btn">File</button>
          </div>

          <div id="device-input-section" class="input-section">
            <div class="input-field-group">
              <label for="device-list">Audio Input</label>
              <select id="device-list" class="select-field">
                <option value="">Scanning audio inputs...</option>
              </select>
            </div>
            <button id="btn-refresh-devices" class="btn-refresh">Refresh</button>
          </div>

          <div id="file-input-section" class="input-section hidden">
            <div class="file-selector">
              <input type="text" id="file-path" readonly placeholder="No file selected" />
              <button id="btn-browse" class="btn">Browse</button>
            </div>
            <label class="checkbox-row">
              <input type="checkbox" id="loop-file" checked />
              <span>Loop</span>
            </label>
          </div>
        </section>

        <section class="panel encode-panel">
          <h2>Encoding Settings</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="encoding-format">Encoding Format</label>
              <input type="text" id="encoding-format" value="Ogg Opus / Icecast" readonly />
            </div>
            <div class="form-group">
              <label for="bitrate-select"
                >Bitrate (Stereo Equivalent) <span id="bitrate-actual-value"></span
              ></label>
              <select id="bitrate-select">
                <option value="64">64 kbps</option>
                <option value="96">96 kbps</option>
                <option value="128" selected>128 kbps</option>
                <option value="160">160 kbps</option>
                <option value="192">192 kbps</option>
                <option value="256">256 kbps</option>
              </select>
            </div>
            <div class="form-group">
              <label for="sample-rate-select">Sample Rate</label>
              <select id="sample-rate-select">
                <option value="44100">44.1 kHz</option>
                <option value="48000" selected>48 kHz</option>
                <option value="96000">96 kHz</option>
              </select>
            </div>
            <div class="form-group channel-template-group">
              <label for="channel-template-select">Stream Channel Template</label>
              <select id="channel-template-select"></select>
            </div>
          </div>
          <div class="channel-panel">
            <div class="channel-panel-header">
              <span>Stream Channels</span>
              <button id="btn-select-default-channels" class="btn-small">Default</button>
            </div>
            <div id="channel-selector" class="channel-selector"></div>
          </div>
          <div class="meter-panel">
            <div class="channel-panel-header">
              <span>Peak Meter</span>
              <span id="meter-state">IDLE</span>
            </div>
            <div id="peak-meter-list" class="peak-meter-list"></div>
          </div>
        </section>

        <section class="panel monitor-panel">
          <h2>Monitor Output</h2>
          <label class="checkbox-row monitor-enable-row">
            <input type="checkbox" id="monitor-enabled" />
            <span>Enable monitor output</span>
          </label>
          <div class="form-grid">
            <div class="form-group">
              <label for="monitor-device-list">Output Device</label>
              <select id="monitor-device-list">
                <option value="">Scanning monitor devices...</option>
              </select>
            </div>
            <div class="form-group">
              <label for="monitor-mode">Monitor Mode</label>
              <select id="monitor-mode">
                <option value="stereo-pair">Stereo Pair</option>
                <option value="downmix">Stereo Downmix</option>
                <option value="binaural">KU100 Near-field HRTF</option>
              </select>
            </div>
            <div class="form-group hidden" id="monitor-buffer-group">
              <label for="monitor-latency">Monitor Buffer</label>
              <select id="monitor-latency">
                <option value="5" selected>5 ms</option>
                <option value="10">10 ms</option>
                <option value="15">15 ms</option>
                <option value="20">20 ms</option>
                <option value="30">30 ms</option>
                <option value="50">50 ms</option>
                <option value="80">80 ms</option>
                <option value="120">120 ms</option>
                <option value="200">200 ms</option>
              </select>
            </div>
            <div class="form-group" id="monitor-pair-group">
              <label for="monitor-source-pair">Monitor Source</label>
              <select id="monitor-source-pair">
                <option value="0">CH1 / CH2</option>
              </select>
            </div>
            <div class="form-group monitor-volume-group">
              <label for="monitor-volume"
                >Monitor Volume <span id="monitor-volume-value">100%</span></label
              >
              <input type="range" id="monitor-volume" min="0" max="100" step="1" value="100" />
            </div>
          </div>
          <div class="meter-panel monitor-meter-panel">
            <div class="channel-panel-header">
              <span>Monitor Peak</span>
              <span id="monitor-meter-state">IDLE</span>
            </div>
            <div id="monitor-peak-meter-list" class="peak-meter-list monitor-peak-meter-list"></div>
          </div>
          <button id="btn-refresh-monitor-devices" class="btn">Refresh Monitor Devices</button>
        </section>

        <section class="panel config-panel">
          <h2>Icecast Settings</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="icecast-host">Host</label>
              <input type="text" id="icecast-host" value="" />
            </div>
            <div class="form-group">
              <label for="icecast-port">Port</label>
              <input type="number" id="icecast-port" value="8000" />
            </div>
            <div class="form-group">
              <label for="mount-point">Mount Point</label>
              <input type="text" id="mount-point" value="/stream" />
            </div>
            <div class="form-group">
              <label for="source-password">Password</label>
              <input type="password" id="source-password" value="" />
            </div>
          </div>
        </section>

        <section class="panel control-panel">
          <div class="controls">
            <button id="btn-start" class="btn-primary">START STREAM</button>
            <button id="btn-stop" class="btn-secondary hidden">STOP STREAM</button>
          </div>
          <div id="stream-timer" class="timer">00:00:00</div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/renderer.js"></script>
  </body>
</html>
