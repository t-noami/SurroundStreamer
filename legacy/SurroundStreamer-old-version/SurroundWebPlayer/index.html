<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Icecast HRTF Monitor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Icecast HRTF Monitor</h1>
        <p>Web Audio API surround binaural receiver</p>
      </div>
      <div class="status-pill" id="connectionStatus">Idle</div>
    </header>

    <main class="app-shell">
      <section class="transport" aria-label="stream controls">
        <label class="url-field">
          <span>Icecast URL</span>
          <input
            id="streamUrl"
            type="url"
            inputmode="url"
            autocomplete="url"
            placeholder="https://example.net:8000/surround.opus"
          />
        </label>

        <div class="transport-actions">
          <button id="playButton" class="primary-button" type="button">Play</button>
          <button id="stopButton" type="button">Stop</button>
        </div>

        <label class="toggle-field">
          <span>CORS Proxy</span>
          <input id="useCorsProxy" type="checkbox" checked />
          <strong id="corsProxyState">On</strong>
        </label>

        <label>
          <span>Layout</span>
          <select id="layoutSelect">
            <option value="mono">Mono</option>
            <option value="stereo">Stereo</option>
            <option value="quad">Quad</option>
            <option value="fiveOne" selected>5.1</option>
            <option value="sevenOne">7.1</option>
            <option value="custom">Custom</option>
          </select>
        </label>

        <label>
          <span>Channels</span>
          <select id="channelCount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="4">4</option>
            <option value="6" selected>6</option>
            <option value="8">8</option>
          </select>
        </label>

        <label>
          <span>Space</span>
          <select id="spaceMode">
            <option value="2d" selected>2D</option>
            <option value="3d">3D</option>
          </select>
        </label>

        <label class="range-field">
          <span>Master</span>
          <input id="masterGain" type="range" min="0" max="1.6" value="0.85" step="0.01" />
          <output id="masterGainValue">0.85</output>
        </label>
      </section>

      <section class="monitor-grid">
        <div class="stage-panel">
          <div class="panel-heading">
            <h2>Stage</h2>
            <div class="meter">
              <span id="meterBar"></span>
            </div>
          </div>
          <canvas id="stageCanvas" width="900" height="620" aria-label="speaker stage"></canvas>
        </div>

        <div class="channel-panel">
          <div class="panel-heading">
            <h2>Channels</h2>
            <button id="resetLayout" type="button">Reset</button>
          </div>
          <div id="channelList" class="channel-list"></div>
        </div>
      </section>

      <section class="diagnostics" aria-live="polite">
        <div>
          <strong>Audio Context</strong>
          <span id="contextState">suspended</span>
        </div>
        <div>
          <strong>Stream</strong>
          <span id="streamState">none</span>
        </div>
        <div>
          <strong>Message</strong>
          <span id="messageLine">Ready</span>
        </div>
      </section>
    </main>

    <audio id="streamElement" crossorigin="anonymous" preload="none"></audio>
    <script src="app.js" defer></script>
  </body>
</html>
